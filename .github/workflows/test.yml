name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -m "not docker" -q

  docker-e2e:
    # ubuntu-latest moves to 26.04 from 2026-10-19; pinned until that's checked.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: docker version
      - run: pytest -m docker -v
