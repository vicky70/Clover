[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clover-cli"
version = "0.1.0"
description = "Clover: witness-backed skill tracks (laptop CLI + Slice 1 server)"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "docker>=7.1",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
]
dev = [
    "clover-cli[server]",
    "pytest>=8",
]

[project.scripts]
clover = "clover.cli:app"

[tool.setuptools.packages.find]
include = ["clover*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: needs a real Docker daemon (skipped when none is reachable)",
]
